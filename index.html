<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>France Wind Live</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Velocity Layer CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.css" />
  <link rel="stylesheet" href="css/style.css">

  <!-- External JS Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Velocity Particle Flow Engine -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
</head>

<body>
  <header>
    <h1>France Wind Live</h1>
    <div class="controls">
      <!-- Model Overlay Selector -->
      <label for="modelSelect" style="font-size: 0.85rem; color: var(--muted);">Model:</label>
      <select id="modelSelect">
        <option value="icon_eu">ICON-EU (Default)</option>
        <option value="meteofrance_arome_france_hd">AROME France HD</option>
        <option value="none">None (Off)</option>
      </select>

      <select id="units">
        <option value="kt">knots</option>
        <option value="kmh">km/h</option>
        <option value="ms">m/s</option>
      </select>
      <button id="refreshMap">Refresh</button>
    </div>
  </header>

  <div id="app-container">
    <div id="map"></div>

    <!-- Detail Drawer / Modal -->
    <div id="drawer">
      <div class="drawer-header">
        <h2 id="stationTitle">Station Detail</h2>
        <button class="close-btn" id="closeDrawer">&times;</button>
      </div>

      <div class="latest-summary">
        <div>
          <div id="latestSpeed" class="speed-val">—</div>
          <div id="latestMeta">—</div>
        </div>
        <div id="compassNeedle">↑</div>
      </div>

      <div class="chart-container">
        <canvas id="detailChart"></canvas>
      </div>
      <p class="chart-note">
        Pinch/scroll to zoom timeline. Data includes IEM history & Open-Meteo forecasts.
      </p>
    </div>
  </div>

  <!-- Application Logic -->
  <script src="js/app.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
